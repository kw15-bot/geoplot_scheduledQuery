name: News collect

# 関連サイトの新しい投稿を集めて news_out/news.json(.enc) を更新する(news_collect.py、HANDOFF_NOTAM.md §27)。
# ビューアはこれを10分おきに読み、まだ見ていない投稿を🔔通知に出す。
#   中国海警局「海警要闻」 https://www.ccg.gov.cn/hjyw/
#   台湾国防部 軍聞社「國防訊息」 https://mna.mnd.gov.tw/news/information/ (RSS から國防訊息だけ)
#   解放军报(数字报)・东部战区の微博(Secret WEIBO_COOKIE。切れたらビューアに表示。取り直して Secret を更新する)
# 2026-10-20: GitHub Actions の schedule は数時間あくこともあった(15分おきの指定が 07:41→15:01→20:33 等)ので外し、
# NOTAM・航行警報と同じく外部の無料cronサービス(cron-job.org)から10分おきに workflow_dispatch を叩く運用にした
# (HANDOFF_NOTAM.md §27.10)。手動実行も可。
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "遡って集める一覧(例: mna / ccg / jfjb / mna ccg)。空なら普段の収集。jfjb は解放军报を 2026-01-01 から"
        required: false
        default: ""
      probe:
        description: "調査用: 記事ページのURL(空白区切り)。HTMLの先頭をログに出すだけで、収集もコミットもしない"
        required: false
        default: ""

permissions:
  contents: write
  actions: write      # 最後に pages-deploy.yml を起動する

concurrency:
  group: news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 2026-10-20: 起動時の sha ではなく、その時点の main の最新から始める(前の実行が news.json をコミットした直後に
      # 起動されると、古い sha から作ったコミットが rebase で衝突して失敗していた)。同じワークフローは同時に走らない(concurrency)
      - uses: actions/checkout@v5
        with:
          ref: data
      # 2026-10-22: データ(notam_out・msa_out・news_out)は data ブランチ、コードは main(HANDOFF_NOTAM.md §29)。
      # data ブランチを取り出し、main のコードをその上に展開する(data ブランチの .gitignore がコードを無視する)
      - name: Get code from main
        run: |
          git fetch --depth=1 origin main
          git archive FETCH_HEAD -- . ':(exclude).gitignore' ':(exclude)notam_out' ':(exclude)msa_out' ':(exclude)news_out' | tar -x
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # リポジトリのデータは暗号化(*.enc)だけ。ランナーの中でだけ平文に戻す(data_crypt.py、HANDOFF_NOTAM.md §25)
      - name: Decrypt data
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          pip install -q cryptography pillow   # pillow: 記事の写真を縮小して写しに埋め込む
          python data_crypt.py decrypt news_out

      # 片方のサイトに失敗しても、もう片方が取れれば成功(終了コード0)。両方失敗したら2で赤くなる
      - name: Collect
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
          PROBE: ${{ github.event.inputs.probe }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}   # 2026-10-22: 东部战区の微博を読むための、ユーザーの微博アカウントの cookie
        run: |
          if [ -n "$PROBE" ]; then
            python news_collect.py --out-dir news_out --probe $PROBE
          elif [ -n "$BACKFILL" ]; then
            python news_collect.py --out-dir news_out --backfill $BACKFILL
          else
            python news_collect.py --out-dir news_out
          fi

      # 2026-10-23: 🔔と同じ規則の新着(報道・NOTAM・航行警報)を、登録した端末に Web Push で送る(webpush.py、HANDOFF_NOTAM.md §30)。
      # NOTAM・航行警報は data ブランチにある最新(同時に動いた収集の分は次の回)を読む。失敗しても収集は止めない
      - name: Web Push
        if: github.event.inputs.backfill == '' && github.event.inputs.probe == ''
        continue-on-error: true
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          python data_crypt.py decrypt notam_out/notam_cn.geojson.enc msa_out/military.geojson.enc layers/webpush_vapid.json.enc
          python webpush.py send --news news_out/news.json --notam notam_out/notam_cn.geojson --msa msa_out/military.geojson

      # news_out/ はこのワークフローしか書かないので、他の収集の push と競合しても rebase で必ず解消できる
      - name: Commit
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          python data_crypt.py encrypt news_out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_out          # news.json.enc と articles/*.enc(記事の写し、v4.4.0)
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "Auto-update news.json [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      # 2026-10-20: push したときだけ GitHub Pages の公開を起動する(まとめて最大10分に1回。pages-deploy.yml)
      - name: Request Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            gh workflow run pages-deploy.yml -R "$GITHUB_REPOSITORY" --ref main || echo "could not request deploy"
          else
            echo "nothing pushed"
          fi
