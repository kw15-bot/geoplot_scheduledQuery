name: Viewer key sync

# ビューア(geoplot-mil.html)のkey入力で照合するハッシュ(KEY_GATE_HASH)を、Secret VIEWER_KEY から
# 作り直してコミットする。keyを変えるときは「Secret VIEWER_KEY を更新 → このワークフローを手動実行」。
# key そのものはどこにも出力しない(ページに載るのはPBKDF2のハッシュだけ。HANDOFF_NOTAM.md §21)。
# 2026-09-29: ビューアの「レイヤー → 航空路」用の暗号化データ(aip/cn_routes_layer.enc)も、同じ VIEWER_KEY で作り直す
# (AIP索引の復号に AIPDS_KEY も使う。HANDOFF_NOTAM.md §22)。AIRACの更新で索引を差し替えたときも、このワークフローを実行する。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: viewer-key-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Update KEY_GATE_HASH from VIEWER_KEY
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, sys
          key = os.environ.get("VIEWER_KEY", "")
          if not key:
              sys.exit("Secret VIEWER_KEY が未設定です")
          path = "geoplot-mil.html"
          html = open(path, encoding="utf-8").read()
          m = re.search(r"const KEY_GATE_SALT = '([^']+)';\s*const KEY_GATE_ITER = (\d+);", html)
          if not m:
              sys.exit("geoplot-mil.html に KEY_GATE_SALT / KEY_GATE_ITER が見つかりません")
          h = hashlib.pbkdf2_hmac("sha256", key.encode("utf-8"), m[1].encode("utf-8"), int(m[2]), 32).hex()
          new, n = re.subn(r"const KEY_GATE_HASH = '[0-9a-f]{64}';", f"const KEY_GATE_HASH = '{h}';", html)
          if n != 1:
              sys.exit("geoplot-mil.html に KEY_GATE_HASH が見つかりません")
          open(path, "w", encoding="utf-8").write(new)
          print("KEY_GATE_HASH updated" if new != html else "KEY_GATE_HASH already up to date")
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild routes layer from the AIP index
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
          AIPDS_KEY: ${{ secrets.AIPDS_KEY }}
        run: |
          if [ -z "$AIPDS_KEY" ] || [ ! -f aip/cn_aip_index.json.gz.enc ]; then
            echo "::warning::AIPDS_KEY not set; routes layer not rebuilt"; exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:AIPDS_KEY \
            -in aip/cn_aip_index.json.gz.enc -out "$RUNNER_TEMP/aip_index.json.gz"
          pip install -q cryptography
          python aip_build_routes_layer.py --index "$RUNNER_TEMP/aip_index.json.gz" --out aip/cn_routes_layer.enc

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geoplot-mil.html
          if [ -f aip/cn_routes_layer.enc ]; then git add aip/cn_routes_layer.enc; fi
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "Viewer: sync key hash and routes layer from VIEWER_KEY"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
