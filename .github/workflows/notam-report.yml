name: NOTAM daily report

# notam_out/ の収集データを1日1回集計し、Qコードの主題(種別)ごとにまとめたレポートを
# notam_out/reports/notam_report_YYYY-MM-DD.md と latest.md に書き出す(notam_daily_report.py)。
#
# 毎日 23:52 UTC(= 08:52 JST)。GitHub Actionsのscheduleはbest-effortで数分〜数十分遅れる
# ことがあるが、日次レポートなので許容する。手動実行(workflow_dispatch)も可。
on:
  schedule:
    - cron: "52 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write      # 最後に pages-deploy.yml を起動する

concurrency:
  group: notam-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
      # 2026-10-22: データ(notam_out・msa_out・news_out)は data ブランチ、コードは main(HANDOFF_NOTAM.md §29)。
      # data ブランチを取り出し、main のコードをその上に展開する(data ブランチの .gitignore がコードを無視する)
      - name: Get code from main
        run: |
          git fetch --depth=1 origin main
          git archive FETCH_HEAD -- . ':(exclude).gitignore' ':(exclude)notam_out' ':(exclude)msa_out' ':(exclude)news_out' | tar -x
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 2026-10-09: リポジトリのデータは暗号化(*.enc)だけ。ランナーの中でだけ平文に戻す(data_crypt.py、HANDOFF_NOTAM.md §25)
      - name: Decrypt data
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          pip install -q cryptography
          python data_crypt.py decrypt notam_out
          python data_crypt.py decrypt news_out

      - name: Build report
        run: python notam_daily_report.py --out-dir notam_out

      # 2026-10-17: 本文どおりに地図に描けているかの点検(notam_check.py)。
      # reports/notam_check_YYYY-MM-DD.md と notam_check_latest.md に書く(下の Commit report で一緒に入る)
      - name: Check drawings
        run: python notam_check.py --out-dir notam_out

      # 2026-10-21: 報道(news_out/news.json)の点検(news_check.py)。news_out/reports/ に書く
      - name: Check news
        run: python news_check.py --out-dir news_out

      # reports/ はこのワークフローしか書かないので、収集側(notam-collect / MSA scrape)の
      # pushと競合しても rebase で必ず解消できる。
      - name: Commit report
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          python data_crypt.py encrypt notam_out/reports
          python data_crypt.py encrypt news_out/reports
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notam_out/reports/*.enc news_out/reports/*.enc
          if git diff --staged --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "NOTAM daily report $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin data && git push origin HEAD:data && exit 0
            sleep $((i * 5))
          done
          exit 1

      # 2026-10-20: push したときだけ GitHub Pages の公開を起動する(まとめて最大10分に1回。pages-deploy.yml)
      - name: Request Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            gh workflow run pages-deploy.yml -R "$GITHUB_REPOSITORY" --ref main || echo "could not request deploy"
          else
            echo "nothing pushed"
          fi
