name: NOTAM collect (CN/HK/MO/TW + REF FIR)

# scrape.yml(MSA)と同じ運用: GitHub Actionsのscheduleトリガーはbest-effortで不安定なため、
# 外部の無料cronサービス(cron-job.org)からこのworkflow_dispatch APIエンドポイントを
# 10分おきに叩く(HANDOFF_NOTAM.md参照)。
#
# 必要な設定(NMS-APIへの実接続を使う場合):
#   Secrets   NMS_CLIENT_ID / NMS_CLIENT_SECRET
#   Variables NMS_ENV (prod | staging | fit)  ※未設定なら staging(取得済み認証情報はstaging用)
#   Secrets   AIPDS_KEY  航空路閉鎖を線にするAIP索引(aip/cn_aip_index.json.gz.enc)の鍵。
#             未設定なら復号をとばし、航空路閉鎖は従来どおりQ項の点になる(HANDOFF_NOTAM.md §19)
# NMS-API側の実運用(prod接続・再配布条件)が未確定な間は、Secretsを設定しなければ
# このジョブは失敗する(＝データは書き換わらない)だけなので、安全側に倒れる。
on:
  workflow_dispatch:
    inputs:
      env:
        description: "NMS環境 (prod | staging | fit)。空ならVariables NMS_ENV、未設定ならstaging"
        required: false
        default: ""
      recheck_geometry:
        description: "収集のあと、取り込み済みの NOTAM の図形を今の読み取り方で作り直す(notam_backfill_text_polygon.py --apply)。読み取りを直したときに1回だけ"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write      # 最後に pages-deploy.yml を起動する

# 同時に2本走らせない(state_active.jsonの競合を構造的に防ぐ)。待機中の重複は最新1本に畳まれる。
concurrency:
  group: notam-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
      # 2026-10-22: データ(notam_out・msa_out・news_out)は data ブランチ、コードは main(HANDOFF_NOTAM.md §29)。
      # data ブランチを取り出し、main のコードをその上に展開する(data ブランチの .gitignore がコードを無視する)
      - name: Get code from main
        run: |
          git fetch --depth=1 origin main
          git archive FETCH_HEAD -- . ':(exclude).gitignore' ':(exclude)notam_out' ':(exclude)msa_out' ':(exclude)news_out' | tar -x
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 2026-10-09: リポジトリのデータは暗号化(*.enc)だけ。ランナーの中でだけ平文に戻す(data_crypt.py、HANDOFF_NOTAM.md §25)
      - name: Decrypt data
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          pip install -q cryptography
          python data_crypt.py decrypt notam_out

      # 復号した索引はランナーの一時領域にだけ置く(コミット対象の notam_out/ には書かない)
      - name: Decrypt AIP index
        env:
          AIPDS_KEY: ${{ secrets.AIPDS_KEY }}
        run: |
          if [ -z "$AIPDS_KEY" ] || [ ! -f aip/cn_aip_index.json.gz.enc ]; then
            echo "AIPDS_KEY not set; route closures stay as Q-line points"; exit 0
          fi
          if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:AIPDS_KEY \
               -in aip/cn_aip_index.json.gz.enc -out "$RUNNER_TEMP/aip_index.json.gz"; then
            echo "AIPDS_INDEX=$RUNNER_TEMP/aip_index.json.gz" >> "$GITHUB_ENV"
          else
            echo "::warning::AIP index decrypt failed (wrong AIPDS_KEY?)"
          fi

      - name: Collect NOTAMs
        env:
          NMS_ENV: ${{ inputs.env || vars.NMS_ENV || 'staging' }}
          NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
          NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
        # 取得失敗時は終了コード2でジョブが赤くなり、以降のコミットは行われない(last_successも進まない)
        run: python notam_cn_collect.py --out-dir notam_out

      # 2026-10-23: 読み取り方を直したとき、取り込み済みの分(state_active.json・archive)にも効かせる(手動で1回だけ)
      - name: Re-check NOTAM shapes
        if: inputs.recheck_geometry
        run: python notam_backfill_text_polygon.py --out-dir notam_out --apply

      - name: Commit updated notam_out
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python notam_commit_state.py --out-dir notam_out --branch data

      # 2026-10-20: push したときだけ GitHub Pages の公開を起動する(まとめて最大10分に1回。pages-deploy.yml)
      - name: Request Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            gh workflow run pages-deploy.yml -R "$GITHUB_REPOSITORY" --ref main || echo "could not request deploy"
          else
            echo "nothing pushed"
          fi
