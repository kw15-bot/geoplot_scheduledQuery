name: MSA scrape

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "25分ガードを無視して強制的に実行する（コード修正直後の動作確認用。定期実行(cron)には影響しない）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: msa-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # We actually want ~30-minute cadence, but GitHub's schedule trigger is
      # best-effort and can be delayed or skipped unpredictably (especially during
      # platform-wide Actions incidents/throttling -- see HANDOFF.md). Firing every
      # 10 minutes instead and skipping here unless >=25 minutes have passed since the
      # last successful scrape gives 3 chances per 30-minute window instead of 1, so an
      # occasional missed/delayed trigger no longer stretches the real-world interval
      # out to an hour or more. Cost is free (public repo Actions minutes), just noisier
      # run history.
      #
      # The "force" checkbox (workflow_dispatch input, default off) lets a manual run
      # skip this guard entirely -- for verifying a msa_scraper.py/geoplot-mil.html fix
      # right after pushing it, without waiting up to 25 minutes for the gate to open.
      # Scheduled (cron) runs never set this input, so the normal cadence/site-load
      # protection is unaffected either way.
      - name: Check if a scrape is actually due
        id: freshness
        run: |
          if [ "${{ inputs.force }}" == "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Force-run requested via workflow_dispatch input -- skipping freshness check"
          else
            last_ts=$(git log -1 --format=%ct -- msa_out/state.json 2>/dev/null || echo 0)
            now_ts=$(date +%s)
            elapsed_min=$(( (now_ts - last_ts) / 60 ))
            echo "Minutes since last state.json commit: $elapsed_min"
            if [ "$last_ts" != "0" ] && [ "$elapsed_min" -lt 25 ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: last successful scrape was only ${elapsed_min}m ago"
            else
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v6
        if: steps.freshness.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: pip install requests beautifulsoup4

      - name: Run scraper
        if: steps.freshness.outputs.should_run == 'true'
        run: python msa_scraper.py --once

      - name: Commit updated geojson/state
        if: steps.freshness.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python commit_state.py --out-dir msa_out --branch main
