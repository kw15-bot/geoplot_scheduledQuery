name: MSA scrape

on:
  # GitHubの schedule トリガーは廃止。GitHub Actions側のcronはbest-effort（努力目標）で
  # 不安定なことが分かったため、外部の無料cronサービス(cron-job.org)からこの
  # workflow_dispatch APIエンドポイントを30分おきに叩く運用に一本化した(詳細はHANDOFF.md)。
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write      # 最後に pages-deploy.yml を起動する

concurrency:
  group: msa-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
      # 2026-10-22: データ(notam_out・msa_out・news_out)は data ブランチ、コードは main(HANDOFF_NOTAM.md §29)。
      # data ブランチを取り出し、main のコードをその上に展開する(data ブランチの .gitignore がコードを無視する)
      - name: Get code from main
        run: |
          git fetch --depth=1 origin main
          git archive FETCH_HEAD -- . ':(exclude).gitignore' ':(exclude)notam_out' ':(exclude)msa_out' ':(exclude)news_out' | tar -x
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # 以前あった「前回の本実行から25分未満ならスキップ」ガードは撤廃。cron-job.org側の
      # 30分間隔そのものが実質的な下限間隔になっているため、ワークフロー側で重ねて
      # 制限する必要がなくなった(詳細はHANDOFF.md)。

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 2026-10-09: リポジトリのデータは暗号化(*.enc)だけ。ランナーの中でだけ平文に戻す(data_crypt.py、HANDOFF_NOTAM.md §25)
      - name: Decrypt data
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          pip install -q cryptography
          python data_crypt.py decrypt msa_out

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python msa_scraper.py --once

      - name: Commit updated geojson/state
        env:
          VIEWER_KEY: ${{ secrets.VIEWER_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python commit_state.py --out-dir msa_out --branch data

      # 2026-10-20: push したときだけ GitHub Pages の公開を起動する(まとめて最大10分に1回。pages-deploy.yml)
      - name: Request Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            gh workflow run pages-deploy.yml -R "$GITHUB_REPOSITORY" --ref main || echo "could not request deploy"
          else
            echo "nothing pushed"
          fi
