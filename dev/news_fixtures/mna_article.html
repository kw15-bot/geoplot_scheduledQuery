<p>（軍聞社記者陳彥樺臺北20日電）國防部今日表示，至上午6時止，偵獲共機14架次（逾越中線進入北部、中部、西南及東部空域計8架次）、共艦7艘及公務船7艘，持續在臺海周邊活動。</p> <p></p> <p> 國防部強調，國軍運用任務機、艦及岸置飛彈系統嚴密監控與應處。</p>
